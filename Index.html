<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #000;
            color: white;
            height: 100vh;
            margin: 0;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .left-container {
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        .logo {
            width: 100%;
            max-width: 400px;
            margin-bottom: 40px;
            text-align: center;
        }

        .login-form {
            background: rgba(36, 36, 36, 0.9);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(255, 200, 0, 0.3);
            width: 100%;
            max-width: 400px;
            border: 1px solid #333;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #f0c419;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #444;
            border-radius: 6px;
            font-size: 16px;
            background-color: #333;
            color: #fff;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #f0c419;
            box-shadow: 0 0 0 2px rgba(240, 196, 25, 0.3);
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 14px;
            background-color: #f0c419;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #000000;
            color: #f0c419;
        }

        .right-container {
            width: 50%;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .batman-image {
            width: 100%;
            height: 135%;
            object-fit: cover;
            object-position: center;
            -webkit-mask-image:
                linear-gradient(to right, transparent 0%, black 20%, black 100%);
            -webkit-mask-repeat: no-repeat;

            mask-image:
                linear-gradient(to right, transparent 0%, black 20%, black 100%);
            mask-repeat: no-repeat;
        }
    </style>
</head>

<body>
    <div class="left-container">
        <div class="logo">
            <img id="logo" src="wayne logo-Photoroom.png" alt="logo wayne industries" width="300px">

        </div>

        <div class="login-form">
            <div class="form-group">
                <form>
                    <label for="campo-nome">Nome de Usuário:</label>
                    <input type="text" name="nome" id="campo-nome" minlength="3" maxlength="30" required>

                    <label for="campo-senha">Senha:</label>
                    <input type="password" name="senha" id="campo-senha" minlength="5" maxlength="30" required>

                    <button type="submit">Enviar</button>
                </form>
            </div>

        </div>
    </div>

    <div class="right-container">
        <img class="batman-image" src="bannerBatman.jpg" alt="Batman" class="logo-direita">
    </div>

    <script src="classesIndex.js" defer></script>
</body>

</html>
